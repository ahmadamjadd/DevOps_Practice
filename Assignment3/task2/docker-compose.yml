name: domjudge_system

services:
  db:
    image: mariadb
    container_name: ${COMPOSE_PROJECT_NAME}_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_USER: domjudge
      MYSQL_PASSWORD: djpw
      MYSQL_DATABASE: domjudge
    command: ["--max-allowed-packet=64M"]
    networks:
      - domjudge_net
    volumes:
      - db_data:/var/lib/mysql

  server:
    image: domjudge/domserver
    container_name: ${COMPOSE_PROJECT_NAME}_server
    ports:
      - "80:80"
    environment:
      MYSQL_HOST: db
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_USER: domjudge
      MYSQL_PASSWORD: djpw
      MYSQL_DATABASE: domjudge
    networks:
      domjudge_net:
        aliases:
          - domserver
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/v4/config"]
      interval: 10s
      timeout: 5s
      retries: 10

  judgehost:
    image: domjudge/judgehost
    privileged: true
    cgroup: host
    environment:
      DOMSERVER_BASEURL: http://domserver/
      JUDGEDAEMON_PASSWORD: password
      DAEMON_ID: 0
    networks:
      - domjudge_net
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    depends_on:
      server:
        condition: service_healthy

networks:
  domjudge_net:
    driver: bridge

volumes:
  db_data:
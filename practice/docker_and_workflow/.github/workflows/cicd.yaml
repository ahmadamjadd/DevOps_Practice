name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Type check and Build
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/practice-backend:latest

      - name: Build and Push Docker Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=http://${{ vars.EC2_HOST }}:4000
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/practice-frontend:latest

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose to EC2
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -vzr --delete
          path: ./docker-compose.yml
          remote_path: /var/www/html/
          remote_host: ${{ vars.EC2_HOST }}
          remote_user: ${{ vars.EC2_USER }}
          remote_key: ${{ secrets.EC2_PRIVATE_KEY }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            cd /var/www/html
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export EC2_HOST=${{ vars.EC2_HOST }}
            docker compose pull
            docker compose up -d
